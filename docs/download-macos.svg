<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80" role="img" aria-label="Download for macOS">
  <title>Download for macOS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>

  <!-- Pill with subtle 1px stroke so it reads against both light and dark GitHub themes. -->
  <rect x="1" y="1" width="258" height="78" rx="14" fill="url(#bg)" stroke="#2a2a2c" stroke-width="1"/>

  <!-- Apple logo. Standard glyph, scaled into the 80px tile. -->
  <g transform="translate(22 22) scale(1.4)" fill="#ffffff">
    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
  </g>

  <!-- "Download for" / "macOS" stacked text -->
  <text x="78" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="1.6" fill="#d8d8d8">DOWNLOAD FOR</text>
  <text x="78" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="-0.4" fill="#ffffff">macOS</text>
</svg>
