<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80" role="img" aria-label="Install via Homebrew">
  <title>Install via Homebrew</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbb040"/>
      <stop offset="1" stop-color="#d98a1c"/>
    </linearGradient>
  </defs>

  <!-- Pill with subtle 1px stroke so it reads against both light and dark GitHub themes. -->
  <rect x="1" y="1" width="258" height="78" rx="14" fill="url(#bg)" stroke="#b97a18" stroke-width="1"/>

  <!-- Stylised Homebrew beer-mug glyph. Hand-rolled SVG so we don't
       pull in the official Homebrew brand asset (which is CC-BY-NC-SA);
       this one is a generic suggestion-of-a-mug to evoke the brand
       without infringing. Scaled to 1.6x to fill the 80px tile. -->
  <g transform="translate(22 18)" fill="#ffffff">
    <!-- Mug body -->
    <path d="M6 6 L6 36 Q6 42 12 42 L30 42 Q36 42 36 36 L36 6 Z"
          fill="#ffffff" stroke="#7a4f15" stroke-width="1.5"/>
    <!-- Handle -->
    <path d="M36 14 Q44 14 44 22 Q44 30 36 30"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Foam bubbles -->
    <circle cx="13" cy="3"  r="3" fill="#ffffff"/>
    <circle cx="21" cy="0"  r="3.5" fill="#ffffff"/>
    <circle cx="29" cy="3"  r="3" fill="#ffffff"/>
    <!-- Hop leaf -->
    <path d="M21 -4 Q24 -8 21 -12 Q18 -8 21 -4 Z" fill="#6aa84f"/>
  </g>

  <!-- "Install via" / "Homebrew" stacked text -->
  <text x="86" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.6" fill="#3b1f00">INSTALL VIA</text>
  <text x="86" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.4" fill="#ffffff">Homebrew</text>
</svg>
