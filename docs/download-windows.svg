<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80" role="img" aria-label="Download for Windows">
  <title>Download for Windows</title>
  <defs>
    <linearGradient id="bgw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="258" height="78" rx="14" fill="url(#bgw)" stroke="#2a2a2c" stroke-width="1"/>

  <!-- Windows logo. 4-pane "tilted" Microsoft logo. -->
  <g transform="translate(22 24)" fill="#ffffff">
    <rect x="0"  y="0"  width="14" height="14"/>
    <rect x="16" y="0"  width="14" height="14"/>
    <rect x="0"  y="16" width="14" height="14"/>
    <rect x="16" y="16" width="14" height="14"/>
  </g>

  <text x="78" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="1.6" fill="#d8d8d8">DOWNLOAD FOR</text>
  <text x="78" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="-0.4" fill="#ffffff">Windows</text>
</svg>
