name: Release

# Push a tag of the form `v1.2.3` to trigger a full automated release:
# build → sign with your Developer ID → notarise → staple → sign with
# Sparkle's EdDSA key → publish a GitHub Release with the .zip → update the
# Sparkle appcast.xml on this branch so users' Sparkle clients pick it up
# automatically.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#
#   BUILD_CERTIFICATE_BASE64      base64 of your Developer ID Application .p12
#   BUILD_CERTIFICATE_PASSWORD    password you set when exporting the .p12
#   KEYCHAIN_PASSWORD             arbitrary; protects the temp keychain in CI
#   APPLE_ID                      your Apple Developer ID (email)
#   APPLE_APP_PASSWORD            app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                 e.g. FF68N39FU5
#   SPARKLE_ED_PRIVATE_KEY        base64 of the EdDSA private key from
#                                 scripts/generate-sparkle-keys.sh
#   SPARKLE_ED_PUBLIC_KEY         the base64-encoded EdDSA public key shown by
#                                 generate_keys (the line after "Public key:"
#                                 — a 44-char string ending in `=`). Injected
#                                 into Info.plist:SUPublicEDKey at build time
#                                 so installed clients can verify update
#                                 signatures.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.0). If empty, taken from the tag.'
        required: false

permissions:
  contents: write  # to push the updated appcast.xml back to the branch

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Required so the post-release commit (updating appcast.xml) can
          # push back to the same branch.
          persist-credentials: true

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
              echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
              TAG="${GITHUB_REF#refs/tags/}"
              echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # ----------------------------------------------------------------
      # Import the Developer ID Application certificate into a temporary
      # keychain. We never write the .p12 to disk in its decoded form except
      # for the duration of `security import`, and the keychain is deleted
      # after the run completes (post: steps).
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain    -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" \
              -P "$BUILD_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN"

          # Make codesign find the cert without prompting.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          rm -f "$CERT_PATH"

      # ----------------------------------------------------------------
      # Inject the real Sparkle public key into Info.plist before archiving.
      # The source tree ships a zero-key placeholder so dev builds don't
      # crash on launch with "Fatal updater error (1)"; release builds need
      # the real key so installed clients can verify update signatures.
      #
      # Allowed to be missing for the *first* release builds — Sparkle
      # auto-update simply won't work until the secret is added, but the
      # build still produces a signed/notarised .zip the user can grab
      # manually from GitHub Releases. The downstream "Sign update with
      # Sparkle EdDSA key" and "Update appcast.xml" steps are gated on
      # the same condition and skipped when the key isn't set.
      - name: Inject Sparkle public key (optional)
        id: sparkle_inject
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PUBLIC_KEY" ]]; then
              echo "::warning::SPARKLE_ED_PUBLIC_KEY not set — releasing without Sparkle in-place updates. Manual download from GitHub Releases will still work."
              echo "configured=false" >> $GITHUB_OUTPUT
              exit 0
          fi
          /usr/libexec/PlistBuddy \
              -c "Set :SUPublicEDKey ${SPARKLE_ED_PUBLIC_KEY}" \
              Xcode/QuickLookProtein/Info.plist
          echo "Injected SUPublicEDKey into Info.plist."
          echo "configured=true" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Build, archive, export. We embed the developer team and signing
      # identity via xcconfig overrides so the project file can keep its
      # build settings clean.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          xcodebuild \
              -project Xcode/QuickLookProtein.xcodeproj \
              -scheme QuickLookProtein \
              -configuration Release \
              -archivePath build/QuickLookProtein.xcarchive \
              -destination 'generic/platform=macOS' \
              -allowProvisioningUpdates \
              MARKETING_VERSION="${{ steps.version.outputs.version }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
              archive

      - name: Export signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key>             <string>developer-id</string>
            <key>teamID</key>             <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>       <string>manual</string>
            <key>signingCertificate</key> <string>Developer ID Application</string>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
              -archivePath build/QuickLookProtein.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist build/ExportOptions.plist

      - name: Verify signature
        run: |
          APP=build/export/QuickLookProtein.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" | head -20

      # ----------------------------------------------------------------
      - name: Package zip
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="build/QuickLookProtein-${VERSION}.zip"
          ( cd build/export && /usr/bin/ditto -c -k --keepParent QuickLookProtein.app "../QuickLookProtein-${VERSION}.zip" )
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "name=QuickLookProtein-${VERSION}.zip" >> $GITHUB_OUTPUT
          du -h "$ZIP"

      # ----------------------------------------------------------------
      - name: Notarise
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.zip.outputs.zip }}" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait

      - name: Staple notarisation ticket
        run: |
          APP=build/export/QuickLookProtein.app
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Re-package stapled .app
        run: |
          ZIP="${{ steps.zip.outputs.zip }}"
          rm -f "$ZIP"
          ( cd build/export && /usr/bin/ditto -c -k --keepParent QuickLookProtein.app "../$(basename $ZIP)" )

      # ----------------------------------------------------------------
      # Sparkle signing. We pull a known-good Sparkle release for its
      # `sign_update` binary, feed it the private key from secrets, and
      # capture the resulting signature line. `sign_update` outputs in the
      # form `sparkle:edSignature="…" length="…"` which slots directly into
      # the appcast enclosure.
      - name: Install Sparkle tools
        if: steps.sparkle_inject.outputs.configured == 'true'
        env:
          SPARKLE_VERSION: '2.6.4'
        run: |
          curl -fsSL -o sparkle.tar.xz \
              "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle
          tar -xf sparkle.tar.xz -C sparkle
          test -x sparkle/bin/sign_update

      - name: Sign update with Sparkle EdDSA key
        if: steps.sparkle_inject.outputs.configured == 'true'
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Sparkle's `sign_update -f <path>` reads the *raw* private key
          # from a file. The secret stores it base64-encoded so it travels
          # safely through GitHub's UI; decode here, then shred.
          KEY_FILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SIG_LINE=$(./sparkle/bin/sign_update -f "$KEY_FILE" "${{ steps.zip.outputs.zip }}")
          rm -f "$KEY_FILE"

          echo "Sparkle signature line: $SIG_LINE"
          {
              echo "signature_line<<__EOF__"
              echo "$SIG_LINE"
              echo "__EOF__"
          } >> $GITHUB_OUTPUT

          LENGTH=$(stat -f %z "${{ steps.zip.outputs.zip }}")
          echo "length=$LENGTH" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # Find the previous tag so we can scope the commit list. If
          # this is the very first release ever, fall back to the last
          # 40 commits so the notes aren't empty.
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$TAG\$" | head -1 || echo "")
          if [[ -n "$PREV_TAG" ]]; then
              RANGE="$PREV_TAG..HEAD"
              RANGE_LABEL="$PREV_TAG..v$VERSION"
          else
              RANGE="HEAD~40..HEAD"
              RANGE_LABEL="first 40 commits"
          fi

          # Categorise commits by subject prefix into themed sections so
          # the release notes read like a changelog and not a git log
          # dump. Anything that doesn't match a category lands in 🔧 Other.
          # Using a Python helper keeps the heredoc out of GitHub's YAML
          # quoting hell.
          python3 - "$RANGE" > "$RUNNER_TEMP/commits.md" <<'PY'
          import subprocess, sys, re
          rng = sys.argv[1]
          out = subprocess.check_output(
              ["git", "log", "--no-merges", "--pretty=format:%s", rng],
              text=True).splitlines()
          # Drop the merge / chore / "Release N" lines themselves so they
          # don't appear in their own release.
          out = [c for c in out if not c.lower().startswith("release ")]

          # (regex, emoji, header)
          CATS = [
              (r"^(QLThumbnail|thumbnail)\b",                   "🖼️", "Thumbnails"),
              (r"^(QLExtension|preview|ContentView|UI)\b",       "👁️", "Quick Look preview & UI"),
              (r"^(viewer|3Dmol|render)\b",                     "🎨", "Renderer"),
              (r"^(Settings|SettingsStorage|@AppStorage)\b",    "⚙️", "Settings"),
              (r"^(Sparkle|update)\b",                          "🔄", "Auto-update"),
              (r"^(workflow|release|CI|GitHub Actions|\.github)", "🚀", "Release / CI"),
              (r"^(README|docs?:?|documentation)\b",             "📝", "Docs"),
              (r"^(Add|Default|Per-format|MMTF|VASP|PQR|CDJSON|format)\b", "✨", "New formats & features"),
              (r"^(Fix|fix:|silence|exclude|stop)\b",            "🐛", "Fixes"),
          ]

          buckets = {h: [] for _, _, h in CATS}
          other = []
          for c in out:
              placed = False
              for pat, _, h in CATS:
                  if re.search(pat, c, re.IGNORECASE):
                      buckets[h].append(c)
                      placed = True
                      break
              if not placed:
                  other.append(c)

          for pat, emoji, h in CATS:
              if buckets[h]:
                  print(f"### {emoji} {h}\n")
                  for line in buckets[h]:
                      # First sentence only — fits a release-notes bullet.
                      first = line.split(":")[-1] if ":" in line else line
                      first = first.strip()
                      print(f"- {first}")
                  print()
          if other:
              print("### 🔧 Other\n")
              for line in other:
                  print(f"- {line}")
              print()
          PY
          COMMITS=$(cat "$RUNNER_TEMP/commits.md")

          ZIPNAME=$(basename "${{ steps.zip.outputs.zip }}")
          SHORTSHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          NOTES_FILE="$RUNNER_TEMP/notes.md"

          cat > "$NOTES_FILE" <<EOF
          ## 🎉 QuickLookProtein ${VERSION}

          A multi-format molecular Quick Look extension for macOS — press <kbd>Space</kbd> in Finder on a structure file, see the 3D molecule.

          ### 📥 Install

          1. Download **${ZIPNAME}** from the Assets below.
          2. Unzip and drag **QuickLookProtein.app** into your **Applications** folder.
          3. Open any \`.pdb\` / \`.cif\` / \`.sdf\` / \`.mol\` / \`.mol2\` / \`.xyz\` / \`.gro\` / \`.cube\` / \`.pqr\` / \`.vasp\` / \`.cdjson\` / \`.mmtf\` file in Finder.
          4. Hit <kbd>Space</kbd> for an interactive 3D preview, or switch to Icon View for molecular thumbnails.

          🔐 **Signed with Developer ID** and **notarised by Apple** — Gatekeeper will let it run without warning.

          ### 📦 What's inside

          - 🧬 13 molecular file formats — PDB, CIF, mmCIF, SDF, MOL, MOL2, XYZ, GRO, CUBE, PDBQT, PQR, VASP, CDJSON, MMTF
          - 🎨 3Dmol.js-powered preview with cartoon / stick / sphere / line / surface styles
          - 🔄 Rotation, color schemes (spectrum / chain / element / secondary-structure / residue), background color, default zoom
          - 🖼️ Native cartoon-ribbon thumbnails for proteins; CPK space-filling for small molecules
          - 🪟 Lives in Quick Look (Space-bar) and in Finder icon view

          ### 📋 Changes ($RANGE_LABEL)

          ${COMMITS}

          ---
          🧪 Built from commit [\`${SHORTSHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on $(date -u +'%Y-%m-%d') by the [release workflow](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml).

          🙏 Originally created by [Jethro Hemmann](https://github.com/JethroHemmann/QuickLookProtein) (2021–2022). Multi-format upgrade by [Ariorad Moniri](https://github.com/ArioMoniri) (2026). Rendering by [3Dmol.js](https://3dmol.csb.pitt.edu) (Rego & Koes, 2015).
          EOF

          if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                  --title "🧬 QuickLookProtein $VERSION" \
                  --notes-file "$NOTES_FILE"
          else
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" "${{ steps.zip.outputs.zip }}" --clobber

      # ----------------------------------------------------------------
      # Append a new <item> to docs/appcast.xml and push it back. GitHub
      # Pages (configured to serve from this branch /docs) will pick it up
      # within a minute, and any installed Sparkle client will see the new
      # release at the next check.
      - name: Update appcast.xml
        if: steps.sparkle_inject.outputs.configured == 'true'
        env:
          APPCAST: docs/appcast.xml
          VERSION: ${{ steps.version.outputs.version }}
          SIGLINE: ${{ steps.sparkle.outputs.signature_line }}
          LENGTH:  ${{ steps.sparkle.outputs.length }}
        run: |
          python3 scripts/update-appcast.py \
              --appcast "$APPCAST" \
              --version "$VERSION" \
              --asset-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ steps.zip.outputs.name }}" \
              --signature-line "$SIGLINE" \
              --length "$LENGTH" \
              --release-url "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

      - name: Commit appcast back to the branch
        if: steps.sparkle_inject.outputs.configured == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag points at the historical commit; we want the commit on
          # the branch (feature/ario-signed) that the tag was cut from, so
          # we check out that branch by name and push there.
          BRANCH="${GITHUB_REF_NAME}"
          # When triggered by a tag push, GITHUB_REF_NAME is the tag, so
          # we use a fallback. Adjust the branch name if you ever rename it.
          if [[ "$BRANCH" == v* ]]; then BRANCH="feature/ario-signed"; fi

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git add docs/appcast.xml
          if git diff --cached --quiet; then
              echo "appcast.xml unchanged; nothing to commit."
              exit 0
          fi
          git commit -m "Release ${{ steps.version.outputs.version }}: appcast update [skip ci]"
          git push origin "$BRANCH"

      # ----------------------------------------------------------------
      - name: Cleanup keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
