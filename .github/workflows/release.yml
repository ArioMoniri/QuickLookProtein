name: Release

# Push a tag of the form `v1.2.3` to trigger a full automated release:
# build → sign with your Developer ID → notarise → staple → sign with
# Sparkle's EdDSA key → publish a GitHub Release with the .zip → update the
# Sparkle appcast.xml on this branch so users' Sparkle clients pick it up
# automatically.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#
#   BUILD_CERTIFICATE_BASE64      base64 of your Developer ID Application .p12
#   BUILD_CERTIFICATE_PASSWORD    password you set when exporting the .p12
#   KEYCHAIN_PASSWORD             arbitrary; protects the temp keychain in CI
#   APPLE_ID                      your Apple Developer ID (email)
#   APPLE_APP_PASSWORD            app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                 e.g. FF68N39FU5
#   SPARKLE_ED_PRIVATE_KEY        base64 of the EdDSA private key from
#                                 scripts/generate-sparkle-keys.sh
#   SPARKLE_ED_PUBLIC_KEY         the base64-encoded EdDSA public key shown by
#                                 generate_keys (the line after "Public key:"
#                                 — a 44-char string ending in `=`). Injected
#                                 into Info.plist:SUPublicEDKey at build time
#                                 so installed clients can verify update
#                                 signatures.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.0). If empty, taken from the tag.'
        required: false

permissions:
  contents: write  # to push the updated appcast.xml back to the branch

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Required so the post-release commit (updating appcast.xml) can
          # push back to the same branch.
          persist-credentials: true

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
              echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
              TAG="${GITHUB_REF#refs/tags/}"
              echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Select Xcode
        # Project uses PBX objectVersion 70 which requires Xcode 16+.
        # macos-15 runners ship multiple Xcode 16 minor versions; pick
        # whichever is newest so we follow Apple's most recent toolchain
        # automatically as runners are refreshed.
        run: |
          NEWEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$NEWEST" ]]; then
              NEWEST=/Applications/Xcode.app
          fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      # ----------------------------------------------------------------
      # Import the Developer ID Application certificate into a temporary
      # keychain. We never write the .p12 to disk in its decoded form except
      # for the duration of `security import`, and the keychain is deleted
      # after the run completes (post: steps).
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain    -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" \
              -P "$BUILD_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN"

          # Make codesign find the cert without prompting.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          rm -f "$CERT_PATH"

      # ----------------------------------------------------------------
      # Inject the real Sparkle public key into Info.plist before archiving.
      # The source tree ships a zero-key placeholder so dev builds don't
      # crash on launch with "Fatal updater error (1)"; release builds need
      # the real key so installed clients can verify update signatures.
      #
      # Allowed to be missing for the *first* release builds — Sparkle
      # auto-update simply won't work until the secret is added, but the
      # build still produces a signed/notarised .zip the user can grab
      # manually from GitHub Releases. The downstream "Sign update with
      # Sparkle EdDSA key" and "Update appcast.xml" steps are gated on
      # the same condition and skipped when the key isn't set.
      - name: Inject Sparkle public key (optional)
        id: sparkle_inject
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PUBLIC_KEY" ]]; then
              echo "::warning::SPARKLE_ED_PUBLIC_KEY not set — releasing without Sparkle in-place updates. Manual download from GitHub Releases will still work."
              echo "configured=false" >> $GITHUB_OUTPUT
              exit 0
          fi
          /usr/libexec/PlistBuddy \
              -c "Set :SUPublicEDKey ${SPARKLE_ED_PUBLIC_KEY}" \
              Xcode/QuickLookProtein/Info.plist
          echo "Injected SUPublicEDKey into Info.plist."
          echo "configured=true" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Build, archive, export. We embed the developer team and signing
      # identity via xcconfig overrides so the project file can keep its
      # build settings clean.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          xcodebuild \
              -project Xcode/QuickLookProtein.xcodeproj \
              -scheme QuickLookProtein \
              -configuration Release \
              -archivePath build/QuickLookProtein.xcarchive \
              -destination 'generic/platform=macOS' \
              -allowProvisioningUpdates \
              MARKETING_VERSION="${{ steps.version.outputs.version }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
              archive

      - name: Export signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key>             <string>developer-id</string>
            <key>teamID</key>             <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>       <string>manual</string>
            <key>signingCertificate</key> <string>Developer ID Application</string>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
              -archivePath build/QuickLookProtein.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist build/ExportOptions.plist

      # ----------------------------------------------------------------
      # Promote Sparkle's XPC services into Contents/XPCServices/.
      #
      # The Sparkle SPM target embeds Installer.xpc and Downloader.xpc
      # inside Sparkle.framework/Versions/B/XPCServices/. macOS's sandbox
      # only honours mach-service lookups when the XPC bundle lives at
      # Contents/XPCServices/ of the *host* app — there's no fallback
      # search path into a framework. Without this step, clicking
      # "Install Update" on a sandboxed Sparkle 2.x build returns
      # "An error occurred while launching the installer."
      #
      # We copy + re-sign the two services with the same Developer ID
      # identity used by the main binary, then run a final --deep sign
      # on the .app so the embedded XPC services are part of the
      # parent's signed contents.
      - name: Embed Sparkle XPC services
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=build/export/QuickLookProtein.app
          SRC="$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices"
          DST="$APP/Contents/XPCServices"
          if [ ! -d "$SRC" ]; then
            echo "::warning::Sparkle.framework XPCServices/ not found — Sparkle dep may not be wired into the target. Skipping."
            exit 0
          fi
          mkdir -p "$DST"
          for svc in Installer.xpc Downloader.xpc; do
            if [ -d "$SRC/$svc" ]; then
              /usr/bin/ditto "$SRC/$svc" "$DST/$svc"
            else
              echo "::warning::$SRC/$svc missing; skipping."
            fi
          done
          # Resolve the actual identity name from the keychain — manual
          # signing in the export step writes "Developer ID Application"
          # as the cert *type*, but the per-binary codesign call here
          # needs the SHA1 or full common name.
          IDENTITY=$(security find-identity -v -p codesigning \
                     | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Could not find Developer ID Application identity in keychain."
            exit 1
          fi
          # Re-sign each XPC service with its OWN entitlements file.
          # Without --entitlements the re-sign strips whatever Sparkle
          # baked in, and a sandboxed host can no longer talk to the
          # services - the user sees "An error occurred while
          # launching the installer." when clicking Install Update.
          # Per https://sparkle-project.org/documentation/sandboxing/
          # each .xpc needs distinct entitlements:
          #   Installer.xpc   -> sandbox + group + read/write /Applications
          #   Downloader.xpc  -> sandbox + group + network.client
          for svc in "$DST"/*.xpc; do
            [ -d "$svc" ] || continue
            base=$(basename "$svc" .xpc)
            ents_file="Xcode/Sparkle/${base}.entitlements"
            if [ ! -f "$ents_file" ]; then
              echo "::error::Missing entitlements file for $base: $ents_file"
              exit 1
            fi
            echo "Re-signing $svc with $ents_file"
            codesign --force --options runtime --timestamp \
                     --entitlements "$ents_file" \
                     --sign "$IDENTITY" "$svc"
          done
          # Re-sign the whole app so the parent's signature covers the
          # XPC services we just added.
          codesign --force --options runtime --timestamp \
                   --entitlements Xcode/QuickLookProtein/QuickLookProtein.entitlements \
                   --sign "$IDENTITY" "$APP"

      - name: Verify signature
        run: |
          APP=build/export/QuickLookProtein.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" | head -20
          # Confirm the XPC services landed where Sparkle expects them.
          ls -la "$APP/Contents/XPCServices/" || true

      # ----------------------------------------------------------------
      - name: Package zip
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="build/QuickLookProtein-${VERSION}.zip"
          ( cd build/export && /usr/bin/ditto -c -k --keepParent QuickLookProtein.app "../QuickLookProtein-${VERSION}.zip" )
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "name=QuickLookProtein-${VERSION}.zip" >> $GITHUB_OUTPUT
          du -h "$ZIP"

      # ----------------------------------------------------------------
      - name: Notarise
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.zip.outputs.zip }}" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait

      - name: Staple notarisation ticket
        run: |
          APP=build/export/QuickLookProtein.app
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Re-package stapled .app
        run: |
          ZIP="${{ steps.zip.outputs.zip }}"
          rm -f "$ZIP"
          ( cd build/export && /usr/bin/ditto -c -k --keepParent QuickLookProtein.app "../$(basename $ZIP)" )

      # ----------------------------------------------------------------
      # DMG packaging — produces the polished drag-to-/Applications
      # window users expect on macOS. The .app inside is already
      # notarised + stapled; the DMG itself needs its own notarisation
      # so Gatekeeper trusts the image at first mount without a network
      # ticket lookup.
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="build/QuickLookProtein-${VERSION}.dmg"
          mkdir -p build/dmg-stage
          # Stage just the .app so the DMG window has exactly one app
          # icon and the /Applications symlink (added by create-dmg).
          /usr/bin/ditto build/export/QuickLookProtein.app build/dmg-stage/QuickLookProtein.app

          create-dmg \
              --volname "QuickLookProtein ${VERSION}" \
              --window-pos 200 120 \
              --window-size 640 400 \
              --icon-size 110 \
              --icon "QuickLookProtein.app" 170 200 \
              --hide-extension "QuickLookProtein.app" \
              --app-drop-link 460 200 \
              --no-internet-enable \
              "$DMG" \
              "build/dmg-stage/"

          echo "dmg=$DMG" >> $GITHUB_OUTPUT
          echo "name=QuickLookProtein-${VERSION}.dmg" >> $GITHUB_OUTPUT
          ls -la "$DMG"

      - name: Sign DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --sign "Developer ID Application" \
                   --timestamp \
                   --options runtime \
                   "${{ steps.dmg.outputs.dmg }}"
          codesign --verify --verbose=2 "${{ steps.dmg.outputs.dmg }}"

      - name: Notarise DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.dmg }}" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait

      - name: Staple DMG
        run: |
          xcrun stapler staple "${{ steps.dmg.outputs.dmg }}"
          xcrun stapler validate "${{ steps.dmg.outputs.dmg }}"

      # ----------------------------------------------------------------
      # Sparkle signing. We pull a known-good Sparkle release for its
      # `sign_update` binary, feed it the private key from secrets, and
      # capture the resulting signature line. `sign_update` outputs in the
      # form `sparkle:edSignature="…" length="…"` which slots directly into
      # the appcast enclosure.
      - name: Install Sparkle tools
        if: steps.sparkle_inject.outputs.configured == 'true'
        env:
          SPARKLE_VERSION: '2.6.4'
        run: |
          curl -fsSL -o sparkle.tar.xz \
              "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle
          tar -xf sparkle.tar.xz -C sparkle
          test -x sparkle/bin/sign_update

      - name: Sign update with Sparkle EdDSA key
        if: steps.sparkle_inject.outputs.configured == 'true'
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Sparkle's `sign_update -f <path>` reads the *raw* private key
          # from a file. The secret stores it base64-encoded so it travels
          # safely through GitHub's UI; decode here, then shred.
          KEY_FILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SIG_LINE=$(./sparkle/bin/sign_update -f "$KEY_FILE" "${{ steps.zip.outputs.zip }}")
          rm -f "$KEY_FILE"

          echo "Sparkle signature line: $SIG_LINE"
          {
              echo "signature_line<<__EOF__"
              echo "$SIG_LINE"
              echo "__EOF__"
          } >> $GITHUB_OUTPUT

          LENGTH=$(stat -f %z "${{ steps.zip.outputs.zip }}")
          echo "length=$LENGTH" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # Find the previous tag so we can scope the commit list. If
          # this is the very first release ever, fall back to the last
          # 40 commits so the notes aren't empty.
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$TAG\$" | head -1 || echo "")
          if [[ -n "$PREV_TAG" ]]; then
              RANGE="$PREV_TAG..HEAD"
              RANGE_LABEL="$PREV_TAG..v$VERSION"
          else
              RANGE="HEAD~40..HEAD"
              RANGE_LABEL="first 40 commits"
          fi

          # Categorise commits by subject prefix into themed sections so
          # the release notes read like a changelog and not a git log
          # dump. Anything that doesn't match a category lands in 🔧 Other.
          # Using a Python helper keeps the heredoc out of GitHub's YAML
          # quoting hell.
          python3 - "$RANGE" > "$RUNNER_TEMP/commits.md" <<'PY'
          import subprocess, sys, re
          rng = sys.argv[1]
          out = subprocess.check_output(
              ["git", "log", "--no-merges", "--pretty=format:%s", rng],
              text=True).splitlines()
          # Drop the merge / chore / "Release N" lines themselves so they
          # don't appear in their own release.
          out = [c for c in out if not c.lower().startswith("release ")]

          # (regex, emoji, header)
          CATS = [
              (r"^(QLThumbnail|thumbnail)\b",                   "🖼️", "Thumbnails"),
              (r"^(QLExtension|preview|ContentView|UI)\b",       "👁️", "Quick Look preview & UI"),
              (r"^(viewer|3Dmol|render)\b",                     "🎨", "Renderer"),
              (r"^(Settings|SettingsStorage|@AppStorage)\b",    "⚙️", "Settings"),
              (r"^(Sparkle|update)\b",                          "🔄", "Auto-update"),
              (r"^(workflow|release|CI|GitHub Actions|\.github)", "🚀", "Release / CI"),
              (r"^(README|docs?:?|documentation)\b",             "📝", "Docs"),
              (r"^(Add|Default|Per-format|MMTF|VASP|PQR|CDJSON|format)\b", "✨", "New formats & features"),
              (r"^(Fix|fix:|silence|exclude|stop)\b",            "🐛", "Fixes"),
          ]

          buckets = {h: [] for _, _, h in CATS}
          other = []
          for c in out:
              placed = False
              for pat, _, h in CATS:
                  if re.search(pat, c, re.IGNORECASE):
                      buckets[h].append(c)
                      placed = True
                      break
              if not placed:
                  other.append(c)

          for pat, emoji, h in CATS:
              if buckets[h]:
                  print(f"### {emoji} {h}\n")
                  for line in buckets[h]:
                      # First sentence only — fits a release-notes bullet.
                      first = line.split(":")[-1] if ":" in line else line
                      first = first.strip()
                      print(f"- {first}")
                  print()
          if other:
              print("### 🔧 Other\n")
              for line in other:
                  print(f"- {line}")
              print()
          PY
          COMMITS=$(cat "$RUNNER_TEMP/commits.md")

          ZIPNAME=$(basename "${{ steps.zip.outputs.zip }}")
          DMGNAME=$(basename "${{ steps.dmg.outputs.dmg }}")
          SHORTSHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          NOTES_FILE="$RUNNER_TEMP/notes.md"

          cat > "$NOTES_FILE" <<EOF
          ## 🎉 QuickLookProtein ${VERSION}

          A multi-format molecular Quick Look extension for macOS — press <kbd>Space</kbd> in Finder on a structure file, see the 3D molecule.

          ### 📥 Install

          #### 🍎 macOS

          **Option A — Disk image (recommended)**

          1. Download **${DMGNAME}** from the Assets below.
          2. Open it and drag **QuickLookProtein** onto the **Applications** shortcut.
          3. Eject the disk image.

          **Option B — Zip**

          1. Download **${ZIPNAME}** from the Assets below.
          2. Unzip and drag **QuickLookProtein.app** into your **Applications** folder.

          Either way: open any \`.pdb\` / \`.cif\` / \`.sdf\` / \`.mol\` / \`.mol2\` / \`.xyz\` / \`.gro\` / \`.cube\` / \`.pqr\` / \`.vasp\` / \`.cdjson\` / \`.mmtf\` file in Finder, hit <kbd>Space</kbd> for the interactive 3D preview, or switch to Icon View for molecular thumbnails.

          🔐 macOS build is **signed with Developer ID** and **notarised by Apple** — Gatekeeper runs it without warning.

          #### 🪟 Windows — one click

          1. Download **[QuickLookProtein-Setup.exe](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/QuickLookProtein-Setup.exe)** from the Assets below.
          2. Double-click it. SmartScreen warns — click **More info → Run anyway**.
          3. Confirm the *"Install QuickLookProtein…"* prompt → **Yes**.
          4. Setup installs [QuickLook](https://github.com/QL-Win/QuickLook) if missing, drops the plugin in your user profile, restarts the tray.
          5. Press <kbd>Space</kbd> on a supported file in Explorer.

          No admin, no PowerShell, no unzip.

          <details>
          <summary>Other install options</summary>

          - **PowerShell one-liner** — \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/feature/ario-signed/Windows/install.ps1 | iex\`
          - **Installer zip** — unpack \`QuickLookProtein-Windows-Installer.zip\`, double-click \`install.bat\`.
          - **Manual** — install [QuickLook for Windows](https://github.com/QL-Win/QuickLook/releases/latest), download \`QuickLookProtein-${VERSION}.qlplugin\`, double-click it while QuickLook is running.

          </details>

          ⚠️ The Windows installer is **unsigned** — SmartScreen will warn on first launch. The plugin runs inside QuickLook (not as a standalone exe).

          ### 📦 What's inside

          - 🧬 13 molecular file formats — PDB, CIF, mmCIF, SDF, MOL, MOL2, XYZ, GRO, CUBE, PDBQT, PQR, VASP, CDJSON, MMTF
          - 🎨 3Dmol.js-powered preview with cartoon / stick / sphere / line / surface styles
          - 🔄 Rotation, color schemes (spectrum / chain / element / secondary-structure / residue), background color, default zoom
          - 🖼️ Native cartoon-ribbon thumbnails for proteins; CPK space-filling for small molecules
          - 🪟 Lives in Quick Look (Space-bar) and in Finder icon view

          ### 📋 Changes ($RANGE_LABEL)

          ${COMMITS}

          ---
          🧪 Built from commit [\`${SHORTSHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on $(date -u +'%Y-%m-%d') by the [release workflow](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml).

          🙏 Originally created by [Jethro Hemmann](https://github.com/JethroHemmann/QuickLookProtein) (2021–2022). Multi-format upgrade by [Ariorad Moniri](https://github.com/ArioMoniri) (2026). Rendering by [3Dmol.js](https://3dmol.csb.pitt.edu) (Rego & Koes, 2015).
          EOF

          if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                  --title "🧬 QuickLookProtein $VERSION" \
                  --notes-file "$NOTES_FILE"
          else
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" \
              "${{ steps.zip.outputs.zip }}" \
              "${{ steps.dmg.outputs.dmg }}" \
              --clobber

          # Also publish a versionless alias for the DMG so the README's
          # macOS "Download" button can use a stable URL:
          #   https://github.com/<repo>/releases/latest/download/QuickLookProtein.dmg
          # GitHub's redirect resolves `releases/latest/download/<filename>`
          # against the latest release's asset list — `<filename>` is matched
          # literally, so we need the alias to exist.
          ALIAS_DMG="build/QuickLookProtein.dmg"
          cp "${{ steps.dmg.outputs.dmg }}" "$ALIAS_DMG"
          gh release upload "$TAG" "$ALIAS_DMG" --clobber

      # ----------------------------------------------------------------
      # Append a new <item> to docs/appcast.xml and push it back. GitHub
      # Pages (configured to serve from this branch /docs) will pick it up
      # within a minute, and any installed Sparkle client will see the new
      # release at the next check.
      - name: Update appcast.xml
        if: steps.sparkle_inject.outputs.configured == 'true'
        env:
          APPCAST: docs/appcast.xml
          VERSION: ${{ steps.version.outputs.version }}
          SIGLINE: ${{ steps.sparkle.outputs.signature_line }}
          LENGTH:  ${{ steps.sparkle.outputs.length }}
        run: |
          python3 scripts/update-appcast.py \
              --appcast "$APPCAST" \
              --version "$VERSION" \
              --asset-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ steps.zip.outputs.name }}" \
              --signature-line "$SIGLINE" \
              --length "$LENGTH" \
              --release-url "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

      - name: Commit appcast back to the branch
        if: steps.sparkle_inject.outputs.configured == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag points at the historical commit; we want the commit on
          # the branch (feature/ario-signed) that the tag was cut from, so
          # we check out that branch by name and push there.
          BRANCH="${GITHUB_REF_NAME}"
          # When triggered by a tag push, GITHUB_REF_NAME is the tag, so
          # we use a fallback. Adjust the branch name if you ever rename it.
          if [[ "$BRANCH" == v* ]]; then BRANCH="feature/ario-signed"; fi

          # The "Update appcast.xml" step just modified docs/appcast.xml
          # in the tag's worktree. Switching to the branch will refuse
          # because of those local changes. Stash, switch, pop, retry.
          # If the upstream branch already advanced (e.g. a previous
          # release commit), rebase the stashed pop on top.
          git stash push --include-untracked -m "appcast-update-${{ steps.version.outputs.version }}" -- docs/appcast.xml || true
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH" || true
          # Re-apply the stashed appcast.xml on top of the branch.
          git stash pop || true

          git add docs/appcast.xml
          if git diff --cached --quiet; then
              echo "appcast.xml unchanged; nothing to commit."
              exit 0
          fi
          git commit -m "Release ${{ steps.version.outputs.version }}: appcast update [skip ci]"
          git push origin "$BRANCH"

      # ----------------------------------------------------------------
      - name: Cleanup keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  # ------------------------------------------------------------------------
  # Windows plugin job — runs after the macOS job creates the release.
  # Cross-compiling WPF from a Mac/Linux runner isn't viable (the
  # WindowsBase / PresentationFramework reference assemblies require the
  # Windows targeting pack), so this lives on its own windows-latest
  # runner. The plugin is unsigned per project decision; SmartScreen
  # will show "More info → Run anyway" on first install.
  windows-plugin:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch QuickLook.Common.dll from QL-Win release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Plugin compiles against QL-Win's public API surface. We don't
        # ship this dll in our .qlplugin — the host process supplies it
        # at load time. We resolve the latest non-prerelease QL-Win
        # version dynamically via the GitHub API so this step doesn't
        # break when QL-Win cuts a new release.
        run: |
          $latest = gh release list --repo QL-Win/QuickLook --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if (-not $latest) { throw "Could not resolve QL-Win latest release tag" }
          Write-Host "Using QL-Win $latest"

          # Each QL-Win release ships a .zip whose name is QuickLook-<tag>.zip
          # The .zip contains the host binaries; QuickLook.Common.dll lives
          # somewhere inside (path varies between minor versions).
          $zipName = "QuickLook-$latest.zip"
          $url = "https://github.com/QL-Win/QuickLook/releases/download/$latest/$zipName"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile QuickLook.zip
          Expand-Archive QuickLook.zip -DestinationPath QuickLook-extracted
          New-Item -ItemType Directory -Path Windows/QuickLookProtein.Plugin/libs -Force | Out-Null

          $commonDll = Get-ChildItem -Path QuickLook-extracted -Recurse -Filter QuickLook.Common.dll | Select-Object -First 1
          if (-not $commonDll) { throw "QuickLook.Common.dll not found in QL-Win release zip" }
          Copy-Item $commonDll.FullName Windows/QuickLookProtein.Plugin/libs/QuickLook.Common.dll
          Write-Host "Reference dll staged from $($commonDll.FullName)"
          Get-Item Windows/QuickLookProtein.Plugin/libs/QuickLook.Common.dll | Format-List FullName, Length

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build Windows/QuickLookProtein.Plugin/QuickLookProtein.Plugin.csproj `
              -c Release `
              -o build/plugin

      - name: Build thumbnail provider
        shell: pwsh
        # Separate output dir so the thumbnail DLL doesn't get lumped
        # into the QuickLook plugin .qlplugin. The Package step below
        # copies it into the .qlplugin alongside the plugin DLL on
        # purpose - install.ps1 registers it as the Explorer thumbnail
        # handler from the same install location.
        run: |
          dotnet build Windows/QuickLookProtein.Thumbnail/QuickLookProtein.Thumbnail.csproj `
              -c Release `
              -o build/thumbnail

      - name: Build Settings WPF app
        shell: pwsh
        # Settings.exe is the Windows-side control panel for user-
        # tunable preferences (atom style per format, rotation,
        # background, etc.). It writes to HKCU registry; the plugin
        # reads from the same hive on every preview. Setup.exe drops
        # the .exe + dll alongside the plugin and writes a Start
        # Menu shortcut.
        run: |
          dotnet build Windows/QuickLookProtein.Settings/QuickLookProtein.Settings.csproj `
              -c Release `
              -o build/settings

      - name: Package .qlplugin
        id: pkg
        shell: pwsh
        # The .qlplugin format is just a zip with the .dll + bundled
        # assets. QL-Win extracts it into
        # %LocalAppData%\QuickLook\plugins\<plugin-name>\ when the user
        # opens it. We exclude the .pdb to keep the archive small.
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "build/qlplugin-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Copy DLL, deps json, and the runtime config from the
          # plugin build. WebView2Loader.dll (native bridge) gets
          # pulled in here via the .csproj's CopyWebView2LoaderNative
          # target - without it QL-Win silently fails to load the
          # plugin and falls back to its text viewer.
          Get-ChildItem build/plugin -File `
              | Where-Object { $_.Extension -in '.dll','.json' } `
              | Copy-Item -Destination $stage

          # Copy the Resources/ folder (3Dmol.js + viewer.html)
          Copy-Item -Path "build/plugin/Resources" -Destination $stage -Recurse

          # Bundle the thumbnail provider DLL (separate build output)
          # into the same .qlplugin folder. install.ps1 finds it next
          # to the plugin DLL and registers per-extension shell
          # handlers so Explorer renders structure thumbnails in
          # Icon / Tile / Gallery views.
          if (Test-Path build/thumbnail/QuickLookProtein.Thumbnail.dll) {
              Copy-Item -Path build/thumbnail/QuickLookProtein.Thumbnail.dll `
                        -Destination $stage -Force
              Write-Host "Bundled thumbnail provider DLL."
          } else {
              Write-Host "::warning::QuickLookProtein.Thumbnail.dll not found in build output; thumbnails will not be registered."
          }

          $qlpName = "QuickLookProtein-$version.qlplugin"
          # PowerShell's Compress-Archive will produce a .zip; we rename
          # the extension. QL-Win identifies plugins by the extension.
          Compress-Archive -Path "$stage/*" -DestinationPath "build/$qlpName" -Force
          Write-Host "Packaged $qlpName"
          Get-Item "build/$qlpName" | Format-List FullName, Length
          "name=$qlpName"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=build/$qlpName"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ----------------------------------------------------------------
      # Build the one-click installer .exe with Inno Setup.
      #
      # Why a single .exe rather than the zip-of-files bundle: the zip
      # works, but it's two clicks (unzip → run .bat). Windows users
      # expect a single double-clickable Setup.exe — same shape as the
      # macOS DMG download. Inno Setup is preinstalled on the
      # `windows-latest` runner image (it ships as `ISCC.exe`) so we
      # don't need to fetch any extra tooling.
      #
      # The .iss script below stages our three payload files into the
      # installer's temp directory and runs install.bat at the end of
      # extraction. install.bat → install.ps1 → drops the plugin into
      # %LocalAppData%\QuickLook\plugins\ exactly the same way the
      # manual / one-liner paths do — the .exe just removes the
      # download-and-unzip dance.
      - name: Build Inno Setup installer
        id: setupexe
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Locate ISCC. Inno Setup 6 lives at the 32-bit Program Files
          # path on github-hosted Windows runners; fall back to PATH for
          # any future runner image that puts it elsewhere.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup (ISCC.exe) not found on runner."
          }
          Write-Host "Using ISCC: $iscc"

          # Stage the payload files. install.bat -> install.ps1 ->
          # .qlplugin is the trio every install path uses; for Setup.exe
          # we ALSO bundle the QuickLook (QL-Win) installer so the user
          # never sees a "Downloading 60 MB QuickLook..." pause and only
          # sees ONE SmartScreen prompt instead of two. install.ps1's
          # auto-detection picks up the sibling QuickLook-*.exe and
          # installs from it instead of fetching from GitHub.
          $stage = "build/setup-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ steps.pkg.outputs.path }}" "$stage/QuickLookProtein.qlplugin" -Force
          Copy-Item "Windows/install.ps1"           "$stage/install.ps1"               -Force
          Copy-Item "Windows/install.bat"           "$stage/install.bat"               -Force

          # Bundle the Settings WPF app + its dependencies into the
          # Setup.exe payload. install.ps1's Install-SettingsApp step
          # copies them out of the plugin folder into a separate
          # %LocalAppData% location and registers a Start Menu
          # shortcut, so the user can launch "QuickLookProtein
          # Settings" without hunting for an EXE.
          if (Test-Path "build/settings/QuickLookProtein.Settings.exe") {
            Get-ChildItem -Path build/settings -File `
                | Where-Object { $_.Extension -in '.exe', '.dll', '.config' } `
                | Copy-Item -Destination $stage
            # The Settings app also needs its SampleAssets subfolder
            # for the live-preview tiles (1.7.21+). Without this the
            # preview panel shows "Sample files not bundled" because
            # the format tiles can't find the bundled .pdb / .cif /
            # etc. samples next to the .exe.
            if (Test-Path "build/settings/SampleAssets") {
              Copy-Item -Path "build/settings/SampleAssets" `
                        -Destination "$stage/SampleAssets" -Recurse -Force
            }
            Write-Host "Bundled Settings WPF app into Setup.exe payload."
          } else {
            Write-Host "::warning::Settings app build output not found; Setup.exe will skip Start Menu shortcut."
          }

          # Pull the QuickLook installer from QL-Win's latest release.
          # QL-Win is GPL-3; bundling the installer unmodified is fine
          # because we point to their source repo in README and in the
          # Inno Setup AppPublisherURL.
          $env:GH_TOKEN = "${{ github.token }}"
          $qlwinTag = gh release list --repo QL-Win/QuickLook `
                                     --exclude-pre-releases --limit 1 `
                                     --json tagName --jq '.[0].tagName'
          if (-not $qlwinTag) { throw "Could not resolve QL-Win latest tag" }
          # Some QL-Win releases prefix the asset filename with v, some
          # don't. Try both forms.
          $tagNoV = $qlwinTag -replace '^v',''
          $tryNames = @("QuickLook-$tagNoV.exe", "QuickLook-$qlwinTag.exe")
          $downloaded = $null
          foreach ($n in $tryNames) {
            $url = "https://github.com/QL-Win/QuickLook/releases/download/$qlwinTag/$n"
            try {
              Invoke-WebRequest -Uri $url -OutFile "$stage/$n" -ErrorAction Stop
              $downloaded = $n
              break
            } catch {
              Write-Host "  (asset $n not present, trying next)"
            }
          }
          if (-not $downloaded) {
            throw "Could not download QL-Win installer for $qlwinTag"
          }
          $size = (Get-Item "$stage/$downloaded").Length
          Write-Host "Bundled QL-Win $qlwinTag installer as $downloaded ($([math]::Round($size/1MB,1)) MB)"

          # Resolve absolute paths up-front. ISCC interprets relative
          # `Source:` and `OutputDir` against its current working
          # directory, which trips us up if we Push-Location'd into
          # build/ — easier to just hand it absolute paths everywhere.
          $buildAbs = (Resolve-Path build).Path
          $stageAbs = Join-Path $buildAbs "setup-stage"

          # Inno Setup script. WizardStyle=modern gives the rounded
          # Windows 11 look; DisableReadyPage skips the redundant
          # "ready to install" page since there's nothing to configure.
          # We don't write an uninstaller because the actual install
          # (drop into %LocalAppData%\QuickLook\plugins) is reversible
          # by deleting that folder — adding an Inno-managed uninstall
          # entry would falsely imply Inno itself owns the install.
          #
          # Note on indentation: PowerShell's @"..."@ here-string
          # preserves whitespace verbatim, and the leading spaces on
          # `[Files]` `Source:` lines confuse some Inno Setup versions.
          # We build the .iss line-by-line to avoid that footgun.
          $isLines = @(
            '; Auto-generated by .github/workflows/release.yml',
            '[Setup]',
            "AppName=QuickLookProtein",
            "AppVersion=$version",
            "AppPublisher=Ariorad Moniri",
            "AppPublisherURL=https://github.com/${{ github.repository }}",
            "AppSupportURL=https://github.com/${{ github.repository }}/issues",
            'DefaultDirName={tmp}\QuickLookProtein-Setup',
            'DisableDirPage=yes',
            'DisableProgramGroupPage=yes',
            'DisableReadyPage=yes',
            'DisableFinishedPage=no',
            'UsePreviousAppDir=no',
            'PrivilegesRequired=lowest',
            "OutputDir=$buildAbs",
            'OutputBaseFilename=QuickLookProtein-Setup',
            'WizardStyle=modern',
            'Compression=lzma2/max',
            'SolidCompression=yes',
            'Uninstallable=no',
            '',
            '[Files]',
            "Source: ""$stageAbs\QuickLookProtein.qlplugin""; DestDir: ""{app}""; Flags: ignoreversion",
            "Source: ""$stageAbs\install.ps1"";               DestDir: ""{app}""; Flags: ignoreversion",
            "Source: ""$stageAbs\install.bat"";               DestDir: ""{app}""; Flags: ignoreversion",
            "; Bundle every sibling QuickLook-*.exe staged above. install.ps1",
            "; auto-detects them and installs without hitting the network.",
            "Source: ""$stageAbs\QuickLook-*.exe"";            DestDir: ""{app}""; Flags: ignoreversion",
            "; Settings WPF app + dependencies. install.ps1 copies",
            "; these from {app} into %LocalAppData%\\QuickLookProtein\\Settings\\",
            "; and writes a Start Menu shortcut so the user can launch",
            "; 'QuickLookProtein Settings' the normal Windows way.",
            "Source: ""$stageAbs\QuickLookProtein.Settings.exe""; DestDir: ""{app}""; Flags: ignoreversion skipifsourcedoesntexist",
            "Source: ""$stageAbs\QuickLookProtein.Settings.exe.config""; DestDir: ""{app}""; Flags: ignoreversion skipifsourcedoesntexist",
            "Source: ""$stageAbs\QuickLookProtein.Settings.runtimeconfig.json""; DestDir: ""{app}""; Flags: ignoreversion skipifsourcedoesntexist",
            "; Bundled sample structures + viewer.html + 3Dmol.js used by",
            "; the Settings app's live preview tiles (1.7.21+).",
            "Source: ""$stageAbs\SampleAssets\*""; DestDir: ""{app}\SampleAssets""; Flags: ignoreversion recursesubdirs createallsubdirs skipifsourcedoesntexist",
            '',
            '[Run]',
            '; Run install.bat with QLP_SETUP_EXE=1 set so the .bat skips its',
            '; "press any key" prompts and runs silently. We launch it hidden',
            '; (no flashing cmd window): the Inno Setup wizard sits at our',
            '; StatusMsg with its own progress bar, no second window to alt-tab.',
            '; install.ps1 logs to %TEMP%\QuickLookProtein-install.log so a',
            '; failure can still be diagnosed post-hoc.',
            'Filename: "cmd.exe"; Parameters: "/C set QLP_SETUP_EXE=1 && ""{app}\install.bat"" > ""%TEMP%\QuickLookProtein-install.log"" 2>&1"; StatusMsg: "Installing QuickLook host and the molecule plugin (this can take up to a minute)..."; Flags: runhidden waituntilterminated'
          )
          $issPath = Join-Path $buildAbs "setup.iss"
          [System.IO.File]::WriteAllText(
            $issPath,
            ($isLines -join "`r`n"),
            [System.Text.UTF8Encoding]::new($true))
          Write-Host "---- setup.iss ----"
          Get-Content $issPath | Write-Host
          Write-Host "-------------------"

          # Compile. Stream ISCC output so a failure surfaces in the
          # job log instead of a silent missing-file at the end.
          & $iscc $issPath
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { throw "Inno Setup compilation failed ($rc)" }

          $setupExe = "build/QuickLookProtein-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            throw "Inno Setup didn't produce $setupExe."
          }
          Get-Item $setupExe | Format-List FullName, Length
          "name=QuickLookProtein-Setup.exe"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=$setupExe"                    | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ----------------------------------------------------------------
      # Package the all-in-one Windows installer bundle. Mostly a
      # convenience artifact for users who want to inspect the scripts
      # before running anything — the Setup.exe above is the primary
      # path. Ships the .qlplugin, install.ps1, install.bat, and a
      # plaintext README.
      - name: Package Windows installer bundle
        id: bundle
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage   = "build/win-installer-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Bundle a stable-name plugin so install.ps1 doesn't have to
          # guess the version.
          Copy-Item -Path "${{ steps.pkg.outputs.path }}" `
                    -Destination "$stage/QuickLookProtein.qlplugin" -Force
          Copy-Item -Path "Windows/install.ps1" `
                    -Destination "$stage/install.ps1"               -Force
          Copy-Item -Path "Windows/install.bat" `
                    -Destination "$stage/install.bat"               -Force

          # Include the Settings WPF app + its dependencies + the
          # SampleAssets subfolder so the zip is also a complete
          # install (matches Setup.exe behaviour). install.ps1's
          # Install-SettingsApp step relocates the lot into
          # %LocalAppData%\QuickLookProtein\Settings\.
          if (Test-Path "build/settings/QuickLookProtein.Settings.exe") {
            Get-ChildItem -Path "build/settings" -File `
                | Where-Object { $_.Extension -in '.exe', '.dll', '.config', '.json' } `
                | Copy-Item -Destination $stage -Force
            if (Test-Path "build/settings/SampleAssets") {
              Copy-Item -Path "build/settings/SampleAssets" `
                        -Destination "$stage/SampleAssets" -Recurse -Force
            }
            Write-Host "Bundled Settings app + SampleAssets into installer zip."
          }

          @"
          QuickLookProtein $version - Windows installer bundle
          =====================================================

          This zip contains everything you need to add 3D molecule
          previews to Windows Explorer.

          What's inside
          -------------
            install.bat                 Double-click this to install.
            install.ps1                 PowerShell installer (called by .bat).
            QuickLookProtein.qlplugin   The plugin itself.

          What it does
          ------------
            1. Installs QuickLook (https://github.com/QL-Win/QuickLook)
               if not already present. This is the Windows-side Quick
               Look host that knows what to do with .qlplugin files.
            2. Drops QuickLookProtein into your user profile at
               %LocalAppData%\QuickLook\plugins\QuickLookProtein\.
               No admin needed.
            3. Restarts the QuickLook tray app so the plugin loads.

          After install
          -------------
            Hit SPACE on any of these in Explorer:
              .pdb .ent .cif .mmcif .sdf .mol .mol2 .xyz
              .gro .cube .pqr .vasp .cdjson .mmtf

          If SmartScreen warns
          --------------------
            Click "More info" then "Run anyway". The installer is
            unsigned; the plugin itself runs inside QuickLook, not
            as a standalone exe.

          Uninstall
          ---------
            Delete %LocalAppData%\QuickLook\plugins\QuickLookProtein\

          Source: https://github.com/${{ github.repository }}
          "@ | Set-Content -Path "$stage/README.txt" -Encoding utf8

          $zipName = "QuickLookProtein-Windows-Installer.zip"
          $zipPath = "build/$zipName"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          Get-Item $zipPath | Format-List FullName, Length

          "name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload .qlplugin to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release upload "v$version" "${{ steps.pkg.outputs.path }}" --clobber

          # Stable versionless alias so the README's "Download for Windows"
          # button can link straight to the .qlplugin:
          #   https://github.com/<repo>/releases/latest/download/QuickLookProtein.qlplugin
          # GitHub matches the asset name literally, so we need a copy named
          # without the version suffix on every release.
          $alias = "build/QuickLookProtein.qlplugin"
          Copy-Item -Path "${{ steps.pkg.outputs.path }}" -Destination $alias -Force
          gh release upload "v$version" $alias --clobber

          # All-in-one installer bundle (single versioned zip — no
          # separate "-latest" alias, the bundle is a fallback artifact
          # and the README points at Setup.exe instead).
          gh release upload "v$version" "${{ steps.bundle.outputs.path }}" --clobber

          # One-click installer .exe. The build step already names the
          # file QuickLookProtein-Setup.exe (no version suffix) so the
          # README button's
          #   releases/latest/download/QuickLookProtein-Setup.exe
          # URL resolves without needing a separate alias copy.
          gh release upload "v$version" "${{ steps.setupexe.outputs.path }}" --clobber
