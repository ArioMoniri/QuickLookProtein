<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="3Dmol.js"></script>
        <style>
            html, body { margin: 0; padding: 0; height: 100%; width: 100%;
                         overflow: hidden;
                         font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
            /* `position: absolute` with all-sides zero gives the WebGL container a
               concrete pixel size derived from <body>, even when WebKit hasn't yet
               resolved `100vh` against the WKWebView's viewport. Without this,
               $3Dmol.createViewer() routinely reads offsetWidth/offsetHeight = 0 at
               script-eval time inside a Quick Look extension's WKWebView and the
               canvas it builds is invisible. */
            #3dviewer  { position: absolute; inset: 0; }
            #3dviewer canvas { display: block; width: 100% !important; height: 100% !important; }
            #info      { position: absolute; top: 8px; left: 8px; z-index: 10;
                         font-size: 11px; color: #555;
                         background: rgba(255,255,255,0.70);
                         padding: 4px 8px; border-radius: 4px; pointer-events: none;
                         max-width: calc(100% - 32px); overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
            #label     { position: absolute; bottom: 8px; left: 8px; z-index: 10;
                         font-size: 11px; color: #222;
                         background: rgba(255,255,255,0.92);
                         padding: 4px 8px; border-radius: 4px; pointer-events: none;
                         display: none; }
            #error     { position: absolute; inset: 0; display: flex;
                         flex-direction: column; align-items: center; justify-content: center;
                         padding: 24px; text-align: center; color: #b00;
                         font-size: 13px; line-height: 1.4; }
            #error .title { font-weight: 600; margin-bottom: 6px; color: #800; }
            @media (prefers-color-scheme: dark) {
                #info  { color: #ddd; background: rgba(30,30,30,0.70); }
                #label { color: #fff; background: rgba(30,30,30,0.92); }
                #error { color: #ff8a8a; }
                #error .title { color: #ffb0b0; }
            }
        </style>
    </head>
    <body>
        <div id="3dviewer"></div>
        <div id="info"></div>
        <div id="label"></div>
        <script type="text/plain" id="mol-data">{MOL_DATA}</script>
        <script>
            (function () {
                // Standard amino acids (the 20) + selenocysteine / pyrrolysine.
                var AA_STANDARD = /^(ALA|ARG|ASN|ASP|CYS|GLN|GLU|GLY|HIS|ILE|LEU|LYS|MET|PHE|PRO|SER|THR|TRP|TYR|VAL|SEC|PYL)$/;
                // Modified/non-standard residues that are biologically part of the polymer.
                // These atoms come into PDB files with hetflag=true and would otherwise be
                // rendered as "ligand" sticks. List drawn from CCD / common force-field aliases.
                // DOC removed — that CCD code is sodium deoxycholate (a detergent), not
                // a residue. Other entries spot-checked against the PDB CCD.
                var AA_MODIFIED = /^(MSE|SEP|TPO|PTR|CSO|OCS|KCX|HYP|PCA|FME|NLE|ABA|ORN|HID|HIE|HIP|HSD|HSE|HSP|CYX|CYM|ASH|GLH|LYN|TPQ|M3L|MLY|MLZ|SMC|DAL|DAR|DAS|DCY|DGL|DGN|DHI|DIL|DLE|DLY|DPN|DPR|DSG|DSN|DTH|DTR|DTY|DVA|MEN|AIB|TYS|CAS|SUI|CCS|CME|CSD|CSE|CSP|CSS|CSX)$/;
                // Nucleic acid residues (DNA + RNA, common one- and three-letter forms).
                var NA_RESIDUES = /^(A|U|G|C|T|I|DA|DT|DG|DC|DU|DI|RA|RU|RG|RC|RI|ADE|URA|GUA|CYT|THY)$/;
                // Common crystallographic additives / cryoprotectants — usually noise.
                // Not hidden by default, but excluded from "interesting ligand" treatment so
                // they don't dominate the view.
                var BUFFER_RES = /^(HOH|WAT|DOD|H2O|SO4|PO4|GOL|EDO|PEG|PG4|PGE|ACT|TRS|IMD|MPD|DMS|FMT|BME|CIT|TLA|MES|EPE|BTB)$/;
                // Single-atom residues that need explicit sphere styling because they have
                // no bonds and would be invisible in any line/stick representation.
                // U and I are deliberately excluded — they collide with uracil / inosine
                // residue names. Uranium / iodine ions in a Quick Look preview are
                // exotic enough to accept the trade-off.
                var MONATOMIC = /^(ZN|FE|FE2|FE3|MG|CA|MN|MN3|CU|CU1|CU2|NA|K|RB|CS|LI|CL|BR|F|HG|NI|CO|CO3|CD|PB|AU|AG|PT|PD|TH|Y|YB|TL|SR|BA|BE|AL|GA|GE|AS|SE|TE|XE|KR|AR)$/;

                function showError(title, detail) {
                    var v = document.getElementById('3dviewer');
                    if (v) v.style.display = 'none';
                    var e = document.createElement('div');
                    e.id = 'error';
                    var t = document.createElement('div');
                    t.className = 'title';
                    t.textContent = title || 'Could not render structure';
                    e.appendChild(t);
                    if (detail) {
                        var d = document.createElement('div');
                        d.textContent = detail;
                        e.appendChild(d);
                    }
                    document.body.appendChild(e);
                }

                document.addEventListener('DOMContentLoaded', function () {
                    try {
                        if (typeof $3Dmol === 'undefined') {
                            return showError('3Dmol.js failed to load');
                        }

                        var dataEl = document.getElementById('mol-data');
                        var data = dataEl ? dataEl.textContent : '';
                        if (!data || data.trim().length === 0) {
                            return showError('Empty file', 'The file contains no readable data.');
                        }

                        var format = "{DATA_FORMAT}";
                        var element = document.getElementById('3dviewer');
                        // Force a synchronous layout pass before $3Dmol reads the
                        // container's offsetWidth/offsetHeight — without this the
                        // WebGL canvas is sometimes built at 0×0 inside a sandboxed
                        // Quick Look extension's WKWebView.
                        void element.offsetWidth;
                        // Passing the id string is the most version-stable form of
                        // createViewer across 3Dmol releases.
                        var viewer = $3Dmol.createViewer('3dviewer', { backgroundAlpha: {BG_ALPHA} });
                        if (!viewer) {
                            return showError('WebGL unavailable',
                                             'Your system or this WKWebView does not support WebGL.');
                        }
                        viewer.setBackgroundColor(0x{BG_COLOR}, {BG_ALPHA});

                        // XYZ files contain only coordinates — without `assignBonds`, 3Dmol
                        // renders nothing for stick/line styles.
                        var addOpts = { keepH: true, multimodel: false };
                        if (format === 'xyz') addOpts.assignBonds = true;

                        try {
                            viewer.addModel(data, format, addOpts);
                        } catch (parseErr) {
                            return showError('Could not parse ' + format.toUpperCase(),
                                             parseErr && parseErr.message ? parseErr.message : String(parseErr));
                        }

                        var model = viewer.getModel();
                        var atoms = model ? model.selectedAtoms({}) : [];
                        if (!atoms || atoms.length === 0) {
                            return showError('No atoms found',
                                             'The file parsed successfully but contained no atoms.');
                        }

                        // Walk atoms once and bucket their serials per class. 3Dmol's
                        // AtomSpec only filters on built-in fields, so passing a custom
                        // property like `{qlPolymer:true}` would silently match nothing.
                        // Serial arrays are universally supported across 3Dmol versions.
                        var hasProtein = false;
                        var hasNucleic = false;
                        var polySerials  = [];
                        var ligSerials   = [];
                        var metalSerials = [];
                        var waterSerials = [];
                        var bufSerials   = [];
                        var chains       = {};
                        for (var i = 0; i < atoms.length; i++) {
                            var a = atoms[i];
                            var resn = (a.resn || '').toUpperCase();
                            var elem = (a.elem || '').toUpperCase();
                            if (a.chain) chains[a.chain] = 1;

                            var isStdAA  = AA_STANDARD.test(resn);
                            var isModAA  = AA_MODIFIED.test(resn);
                            var isNA     = NA_RESIDUES.test(resn);
                            var isPoly   = isStdAA || isModAA || isNA;
                            var isWater  = (resn === 'HOH' || resn === 'WAT' || resn === 'DOD' || resn === 'H2O');
                            var isBuffer = BUFFER_RES.test(resn) && !isWater;
                            // Don't tag a polymer residue as a metal even if its 1-letter
                            // code happens to match (the U/I/T overlap case is already
                            // handled by MONATOMIC's regex, but elem-based matching could
                            // still mis-fire on stray heteroatoms with these names).
                            var isMetal  = !isPoly && (MONATOMIC.test(resn) || MONATOMIC.test(elem));

                            // 3Dmol's `serial` is the original PDB serial (or sequential
                            // for non-PDB formats) — unique per atom. Fall back to `index`
                            // if a model lacks serials.
                            var key = (a.serial !== undefined) ? a.serial : a.index;

                            if (isPoly)        polySerials.push(key);
                            else if (isMetal)  metalSerials.push(key);
                            else if (isWater)  waterSerials.push(key);
                            else if (isBuffer) bufSerials.push(key);
                            else if (a.hetflag) ligSerials.push(key);

                            if (isStdAA || isModAA) hasProtein = true;
                            if (isNA)               hasNucleic = true;
                        }
                        var chainCount = Object.keys(chains).length;
                        var hasPolymer = hasProtein || hasNucleic;
                        var hasLigand  = ligSerials.length   > 0;
                        var hasMetal   = metalSerials.length > 0;

                        var colorScheme = "{COLOR_SCHEME}";
                        function colorFor() {
                            switch (colorScheme) {
                                case 'chain':    return { colorscheme: 'chainHetatm' };
                                case 'element':  return { colorscheme: 'Jmol' };
                                case 'ssJmol':   return hasProtein ? { colorscheme: 'ssJmol' }
                                                                   : { colorscheme: 'Jmol' };
                                case 'residue':  return { colorscheme: 'amino' };
                                case 'spectrum':
                                default:         return { color: 'spectrum' };
                            }
                        }

                        var requestedStyle = "{ATOM_STYLE}";
                        // Cartoon only makes sense for biopolymers (protein or nucleic acid)
                        var styleType = requestedStyle;
                        if (styleType === 'cartoon' && !hasPolymer) styleType = 'stick';

                        // Apply a base style to EVERY atom first as a safety net.
                        // If any of the smart-style serial-array selectors below silently
                        // matches nothing on a particular 3Dmol build, this guarantees
                        // the model is still visible instead of rendering blank.
                        var baseStyle = {}; baseStyle[styleType] = colorFor();
                        viewer.setStyle({}, baseStyle);

                        if ({AUTO_STYLE_HETERO} && hasPolymer && (hasLigand || hasMetal)) {
                            // Polymer rendered with the user's chosen style; ligands as
                            // sticks; metal ions as VDW spheres (otherwise invisible);
                            // waters hidden by default; buffer additives as faint lines.
                            var polymer = {}; polymer[styleType] = colorFor();
                            viewer.setStyle({ serial: polySerials  }, polymer);
                            viewer.setStyle({ serial: ligSerials   }, { stick:  { colorscheme: 'Jmol', radius: 0.18 } });
                            viewer.setStyle({ serial: metalSerials }, { sphere: { colorscheme: 'Jmol', scale: 0.45 } });
                            viewer.setStyle({ serial: bufSerials   }, { line:   { colorscheme: 'Jmol' } });
                            viewer.setStyle({ serial: waterSerials }, {}); // hidden by default
                        } else if (hasMetal) {
                            // Without smart styling, baseStyle covers everything; metals
                            // would still render as the baseStyle (sticks etc.) but
                            // single-atom ions need explicit spheres to be visible.
                            viewer.setStyle({ serial: metalSerials },
                                            { sphere: { colorscheme: 'Jmol', scale: 0.45 } });
                        }

                        if ({HIDE_H}) {
                            viewer.setStyle({ elem: 'H' }, {});
                        }

                        // In thumbnail mode, force a surface for proteins: cartoons are
                        // unrecognisable at icon sizes, and a surface blob distinguishes
                        // structures at-a-glance.
                        var doSurface = {SHOW_SURFACE} || ({THUMBNAIL_MODE} && hasProtein);
                        if (doSurface) {
                            // Surface generation is O(N²) in 3Dmol and routinely OOMs
                            // small-budget extension processes on >~3k atoms.
                            var SURFACE_ATOM_CAP = 3000;
                            if (atoms.length <= SURFACE_ATOM_CAP) {
                                try {
                                    var surfSel = hasPolymer ? { serial: polySerials } : {};
                                    var surfStyle = {THUMBNAIL_MODE}
                                        ? { opacity: 1.0, colorscheme: 'whiteCarbon' }
                                        : { opacity: 0.50, color: 'white' };
                                    viewer.addSurface($3Dmol.SurfaceType.VDW, surfStyle, surfSel);
                                } catch (surfErr) { /* surface gen can fail on weird inputs */ }
                            }
                        }

                        // Zoom BEFORE the unit cell so the framing is set by the molecule,
                        // not by the (possibly much larger) crystallographic box.
                        viewer.zoomTo();

                        if ({SHOW_UNIT_CELL}) {
                            try { viewer.addUnitCell(); } catch (cellErr) { /* no cell data */ }
                        }

                        if ({SHOW_INFO}) {
                            var infoEl = document.getElementById('info');
                            var parts = [];
                            var fileName = "{FILE_NAME}";
                            if (fileName) parts.push(fileName);
                            parts.push(atoms.length.toLocaleString() + ' atoms');
                            if (chainCount > 0) parts.push(chainCount + ' chain' + (chainCount === 1 ? '' : 's'));
                            parts.push(format.toUpperCase());
                            infoEl.textContent = parts.join(' · ');
                        }

                        var labelEl = document.getElementById('label');
                        viewer.setClickable({}, true, function (atom) {
                            if (!atom) { labelEl.style.display = 'none'; return; }
                            var bits = [];
                            if (atom.elem) bits.push(atom.elem);
                            if (atom.atom && atom.atom !== atom.elem) bits.push(atom.atom);
                            if (atom.resn) bits.push(atom.resn);
                            if (atom.resi !== undefined && atom.resi !== '') bits.push(atom.resi);
                            if (atom.chain) bits.push('Chain ' + atom.chain);
                            labelEl.textContent = bits.join(' · ');
                            labelEl.style.display = 'block';
                        });

                        viewer.render();
                        var spin = {ROTATION_SPEED};
                        if (spin > 0) viewer.spin('y', spin);

                        // Thumbnail bridge: when the viewer host (QLThumbnail
                        // extension) sets `{THUMBNAIL_MODE}` true, render once with a
                        // canonical isometric pose and post a PNG data URI back so the
                        // host can build a QLThumbnailReply. Wrapped in try/catch
                        // because the message bridge is absent in the preview extension
                        // and main app, and accessing `webkit.messageHandlers.X` throws
                        // there.
                        if ({THUMBNAIL_MODE}) {
                            try {
                                // Canonical orientation: two RCSB downloads of the same
                                // protein land in different reference frames, so without
                                // a consistent pose the thumbnails look unrelated.
                                viewer.center();
                                viewer.rotate(30, 'x');
                                viewer.rotate(-30, 'y');
                                viewer.zoomTo();
                                viewer.render();
                                // Wait a frame so the WebGL canvas is committed.
                                requestAnimationFrame(function () {
                                    // A second RAF gives the surface (if any) time to
                                    // appear — surface rendering is async in 3Dmol.
                                    requestAnimationFrame(function () {
                                        try {
                                            var uri = viewer.pngURI();
                                            if (window.webkit && window.webkit.messageHandlers
                                                && window.webkit.messageHandlers.qlThumbnailReady) {
                                                window.webkit.messageHandlers.qlThumbnailReady.postMessage(uri);
                                            }
                                        } catch (e) { /* nothing we can do here */ }
                                    });
                                });
                            } catch (e) { /* ditto */ }
                        }
                    } catch (err) {
                        showError('Unexpected error', err && err.message ? err.message : String(err));
                    }
                });
            })();
        </script>
    </body>
</html>
